plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = '0.4.1'
neoForge {
    runs {
        client { client(); programArguments.addAll '--username', 'InventoryTest', '--width', '1440', '--height', '900' }
        server { server(); programArgument '--nogui' }
    }
    mods { civitatum_inventory { sourceSet(sourceSets.main) } }
}

if (project.hasProperty('racesJar')) { dependencies { runtimeOnly files(project.property('racesJar')) } }
def compatDirectory = project.findProperty('compatDir') ?: "${rootDir}/../compat-reference"
if (project.hasProperty('compat')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'camping.jar', 'curios.jar', 'xaeros-world-map.jar', 'xaerolib.jar' } } }
if (project.hasProperty('accessories')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'accessories.jar', 'owo-lib.jar' } } }
if (project.hasProperty('aether')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'aether.jar', 'owo-lib.jar' } } }
if (project.hasProperty('apothic')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'apothic-attributes.jar', 'placebo.jar' } } }
if (project.hasProperty('ars')) { dependencies { runtimeOnly fileTree(compatDirectory) { include 'ars-nouveau.jar', 'geckolib.jar', 'curios.jar' } } }
