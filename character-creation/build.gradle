plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
version = '0.4.2'
neoForge {
    runs {
        client { client(); programArguments.addAll '--username', 'CivitatumTest', '--width', '1440', '--height', '900' }
        server { server(); programArgument '--nogui' }
    }
    mods { civitatum { sourceSet(sourceSets.main) } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) { from(rootProject.file('LICENSE.txt')) }

if (project.hasProperty('female')) {
    dependencies { runtimeOnly files(project.findProperty('femaleJar') ?: 'libs/FemaleGenderMod.jar') }
}
