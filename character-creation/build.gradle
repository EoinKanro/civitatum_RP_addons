plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
}

// Generators for the mod's textures; not part of the mod jar.
sourceSets {
    tools
}

tasks.register('generateFacialHair', JavaExec) {
    group = 'tools'
    description = 'Regenerates the beard and mustache textures, textures/character/facial_hair/*.png.'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'team.civitatum.charactercreation.tools.FacialHairTexturesGenerator'
    workingDir = projectDir
}
