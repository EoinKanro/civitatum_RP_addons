plugins {
    // loaded once here so that the modules share it
    id 'net.neoforged.moddev' apply false
}

// Settings shared by every mod. Each module's build.gradle keeps its own version, runs and extras.
subprojects {
    group = 'team.civitatum'

    // the jar: civitatum-<module name>-<version>.jar
    plugins.withId('base') {
        project.base.archivesName = "civitatum-${project.name}"
    }

    repositories {
        mavenCentral()
    }

    plugins.withId('java') {
        java.toolchain.languageVersion = JavaLanguageVersion.of(21)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        // unit tests: JUnit 5 in src/test, run by `test` (and so by `build`)
        dependencies {
            testImplementation platform('org.junit:junit-bom:5.11.4')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
        }

        // every mod jar carries the repository's licence
        tasks.named('jar', Jar) {
            from(rootProject.file('LICENSE.txt'))
        }
    }

    plugins.withId('net.neoforged.moddev') {
        neoForge {
            version = neo_version
        }
    }
}
